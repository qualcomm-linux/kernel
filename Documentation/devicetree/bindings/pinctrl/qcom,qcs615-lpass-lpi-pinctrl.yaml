%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/qcom,qcs615-lpass-lpi-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm QCS615 SoC LPASS LPI TLMM

maintainers:
  - Karthik S <karthik.s@oss.qualcomm.com>

description:
  Top Level Mode Multiplexer pin controller in the Low Power Audio SubSystem
  (LPASS) Low Power Island (LPI) of Qualcomm QCS615 SoC.

properties:
  compatible:
    const: qcom,qcs615-lpass-lpi-pinctrl

  reg:
    items:
      - description: LPASS LPI TLMM Control and Status registers
      - description: LPASS LPI MCC registers

  clocks:
    items:
      - description: LPASS Core voting clock

  clock-names:
    items:
      - const: core

patternProperties:
  "-state$":
    oneOf:
      - $ref: "#/$defs/qcom-qcs615-lpass-state"
      - patternProperties:
          "-pins$":
            $ref: "#/$defs/qcom-qcs615-lpass-state"
        additionalProperties: false

$defs:
  qcom-qcs615-lpass-state:
    type: object
    description:
      Pinctrl node's client devices use subnodes for desired pin configuration.
      Client device subnodes use below standard properties.
    $ref: qcom,lpass-lpi-common.yaml#/$defs/qcom-tlmm-state
    unevaluatedProperties: false

    properties:
      pins:
        description:
          List of gpio pins affected by the properties specified in this
          subnode.
        items:
          pattern: "^gpio([0-9]|1[0-9]|2[0-9]|3[0-1])$"

      function:
        enum: [ dmic1_clk, dmic1_data, dmic2_clk, dmic2_data, gpio, i2s1_clk,
                i2s1_data, i2s1_ws, spkr_i2s_mclk_a ]
        description:
          Specify the alternative function to be configured for the specified
          pins.

allOf:
  - $ref: qcom,lpass-lpi-common.yaml#

required:
  - compatible
  - reg
  - clocks
  - clock-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/sound/qcom,q6afe.h>
    lpi_tlmm: pinctrl@62b40000 {
        compatible = "qcom,qcs615-lpass-lpi-pinctrl";
        reg = <0x62b40000 0x20000>,
              <0x62b00000 0x10000>;
        clocks = <&q6afecc LPASS_HW_MACRO_VOTE LPASS_CLK_ATTRIBUTE_COUPLE_NO>;
        clock-names = "core";
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&lpi_tlmm 0 0 32>;

        i2s1-active-state {
            clk-pins {
                pins = "gpio8";
                function = "i2s1_clk";
                drive-strength = <8>;
                bias-disable;
                output-high;
            };

            ws-pins {
                pins = "gpio9";
                function = "i2s1_ws";
                drive-strength = <8>;
                bias-disable;
                output-high;
            };

            data-pins {
                pins = "gpio10", "gpio11";
                function = "i2s1_data";
                drive-strength = <8>;
                bias-disable;
            };
        };
    };
