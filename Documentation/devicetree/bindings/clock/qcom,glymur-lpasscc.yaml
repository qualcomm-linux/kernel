%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,glymur-lpasscc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm LPASS Core Clock Controller on Glymur

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@oss.qualcomm.com>

description: |
  Qualcomm LPASS core and audio clock control module provides the clocks,
  and reset on Glymur.

  See also::
    include/dt-bindings/clock/qcom,lpasscc-glymur.h

properties:
  compatible:
    - qcom,glymur-lpasscc

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

required:
  - compatible
  - reg
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,glymur-lpasscc.h>
    lpass_audiocc: clock-controller@32a9000 {
        compatible = "qcom,glymur-lpasscc";
        reg = <0x032a9000 0x1000>;
        #clock-cells = <1>;
        #reset-cells = <1>;
    };

...
