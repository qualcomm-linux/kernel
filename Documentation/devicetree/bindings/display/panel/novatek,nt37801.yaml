%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/novatek,nt37801.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT37801 and NT37802 AMOLED DSI Panels

maintainers:
  - Krzysztof Kozlowski <krzk@kernel.org>

description:
  Naming is inconclusive and different sources claim the NT37801 panel is
  either Novatek NT37801 or NT37810. The NT37802 panel uses the same common
  DSI interface and regulator supplies, and additionally requires EXVDD.

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    enum:
      - novatek,nt37801
      - novatek,nt37802

  reg:
    maxItems: 1
    description: DSI virtual channel

  exvdd-supply: true
  vci-supply: true
  vdd-supply: true
  vddio-supply: true
  port: true
  reset-gpios: true

required:
  - compatible
  - reg
  - vci-supply
  - vdd-supply
  - vddio-supply
  - port
  - reset-gpios

additionalProperties: false

if:
  properties:
    compatible:
      contains:
        const: novatek,nt37802
then:
  required:
    - exvdd-supply
else:
  properties:
    exvdd-supply: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "novatek,nt37801";
            reg = <0>;

            vci-supply = <&vreg_l13b_3p0>;
            vdd-supply = <&vreg_l11b_1p2>;
            vddio-supply = <&vreg_l12b_1p8>;

            reset-gpios = <&tlmm 98 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "novatek,nt37802";
            reg = <0>;

            vci-supply = <&vreg_l13b_3p0>;
            vdd-supply = <&vreg_l11b_1p2>;
            vddio-supply = <&vreg_l12b_1p8>;
            exvdd-supply = <&display_panel_vdd>;

            reset-gpios = <&tlmm 210 GPIO_ACTIVE_LOW>;

            port {
                endpoint {
                    remote-endpoint = <&dsi0_out>;
                };
            };
        };
    };
...
