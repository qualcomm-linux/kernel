%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/cypress,cypd6129.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cypress cypd6129/cypd6229 Type-C Controller

maintainers:
  - Akash Kumar <akash.kumar@oss.qualcomm.com>

description:
  The Cypress cypd6129 and cypd6229 are dual Type-C PD controllers that are
  controlled via an I2C interface.

properties:
  compatible:
    oneOf:
      - const: cypress,cypd6129
      - items:
          - const: cypress,cypd6229
          - const: cypress,cypd6129

  '#address-cells':
    const: 1

  '#size-cells':
    const: 0

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  pinctrl-0: true
  pinctrl-1: true

  pinctrl-names:
    minItems: 1
    items:
      - const: default
      - const: sleep

patternProperties:
  '^connector@[01]$':
    $ref: /schemas/connector/usb-connector.yaml#
    required:
      - reg

required:
  - compatible
  - reg
  - interrupts

anyOf:
  - required:
      - connector@0
  - required:
      - connector@1

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
      #address-cells = <1>;
      #size-cells = <0>;

      typec@40 {
        compatible = "cypress,cypd6129";
        reg = <0x40>;
        interrupts-extended = <&tlmm 136 IRQ_TYPE_LEVEL_LOW>;
        pinctrl-0 = <&usb0_intr_state>;
        pinctrl-names = "default";
        #address-cells = <1>;
        #size-cells = <0>;

        connector@0 {
          compatible = "usb-c-connector";
          reg = <0>;
          label = "USB-C";
          data-role = "dual";
          power-role = "dual";
          wakeup-source;
          ports {
            #address-cells = <1>;
            #size-cells = <0>;
            port@0 {
              reg = <0>;
              endpoint {
                remote-endpoint = <&usb_role_switch0>;
              };
            };
          };
        };
      };
    };
