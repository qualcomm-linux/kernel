%YAML 1.2
---
$id: http://devicetree.org/schemas/soundwire/qcom,soundwire-multilane.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm multi-lane (aggregated) SoundWire Controller

maintainers:
  - Srinivas Kandagatla <srinivas.kandagatla@linaro.org>

description: |
  Some Qualcomm SoC audio subsystems split a single logical SoundWire bus into
  two physical SoundWire master IP blocks: a *primary* block carrying the
  control lane plus some TX (source) data lanes, and a *secondary* block
  carrying additional data lanes only (typically RX/sink data).

  This binding describes a logical SoundWire bus composed of those two
  physical IP blocks. From the Linux SoundWire framework's perspective it is
  a single bus with multiple data lanes; the driver internally routes
  per-port register writes to the correct IP block according to each port's
  lane.

  This matches the SDCA "compute mode" topology (one peripheral, one logical
  SoundWire bus, multiple data lanes — per MIPI SDCA v1.1 §4.2 and DisCo for
  SoundWire v2.1 §5.3).

  The mobile-mode (legacy) topology, where the same SoC's TX and RX SWR IP
  blocks are independent buses with their own slaves, continues to be
  described by qcom,soundwire.yaml.

properties:
  compatible:
    enum:
      - qcom,soundwire-multilane-v3.1.0

  reg:
    items:
      - description: Primary IP block (control lane + first data lane(s))
      - description: Secondary IP block (additional data lanes only)

  reg-names:
    items:
      - const: primary
      - const: secondary

  interrupts:
    items:
      - description: Primary IP interrupt
      - description: Secondary IP interrupt

  interrupt-names:
    items:
      - const: primary
      - const: secondary

  clocks:
    items:
      - description: Primary IP iface clock
      - description: Secondary IP iface clock

  clock-names:
    items:
      - const: primary
      - const: secondary

  resets:
    items:
      - description: Primary IP SWR_AUDIO_CGCR reset
      - description: Secondary IP SWR_AUDIO_CGCR reset

  reset-names:
    items:
      - const: primary
      - const: secondary

  pinctrl-0:
    description: Pinctrl groups for both primary and secondary IP data/clk pins.

  pinctrl-names:
    const: default

  '#sound-dai-cells':
    const: 1

  '#address-cells':
    const: 2

  '#size-cells':
    const: 0

  qcom,lane-banks:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: |
      Lane → register-bank assignment.  One byte per logical SoundWire lane,
      indexed by lane number (0..7):

        - 0 = primary IP block (uses `reg = primary`)
        - 1 = secondary IP block (uses `reg = secondary`)

      Logical lane 0 must be 0 (control path lives on the primary).

      Example for Tambora compute mode (lanes 0/1 on primary, lanes 2/3 on
      secondary):  /bits/ 8 <0 0 1 1>
    minItems: 1
    maxItems: 8

  # Per-port arrays — semantics identical to qcom,soundwire.yaml.  Each
  # port's qcom,ports-lane-control identifies its lane; the driver uses
  # qcom,lane-banks to pick the IP block for register writes.
  qcom,ports-word-length:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Word length per port; 0xff = not applicable.
    minItems: 3
    maxItems: 17
  qcom,ports-sinterval:
    $ref: /schemas/types.yaml#/definitions/uint16-array
    description: Sample interval per port; 0xffff = not applicable.
    minItems: 3
    maxItems: 17
  qcom,ports-sinterval-low:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Low byte of sample interval per port; 0xff = not applicable.
    minItems: 3
    maxItems: 17
  qcom,ports-offset1:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Transport window offset1 per port; 0xff = not applicable.
    minItems: 3
    maxItems: 17
  qcom,ports-offset2:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Transport window offset2 per port; 0xff = not applicable.
    minItems: 3
    maxItems: 17
  qcom,ports-hstart:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: HStart per port (0..15 or 0xff = unset).
    minItems: 3
    maxItems: 17
  qcom,ports-hstop:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: HStop per port (0..15 or 0xff = unset).
    minItems: 3
    maxItems: 17
  qcom,ports-lane-control:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Logical lane number per port (0..7); 0xff = unset.
    minItems: 3
    maxItems: 17
  qcom,ports-block-pack-mode:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Block packing mode per port (0=BPC, 1=BPP, 0xff = unset).
    minItems: 3
    maxItems: 17
  qcom,ports-block-group-count:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    description: Block group count per port (1..4 or 0xff = unset).
    minItems: 3
    maxItems: 17

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - '#sound-dai-cells'
  - '#address-cells'
  - '#size-cells'
  - qcom,lane-banks
  - qcom,ports-offset1
  - qcom,ports-offset2
  - qcom,ports-lane-control

oneOf:
  - required:
      - qcom,ports-sinterval-low
  - required:
      - qcom,ports-sinterval

allOf:
  - $ref: soundwire-controller.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    /* Tambora compute mode on Glymur: TX IP @ 0x7630000 (control + lanes 0/1)
     * and RX IP @ 0x6a80000 (lanes 2/3) form one logical bus. */
    soundwire@7630000 {
        compatible = "qcom,soundwire-multilane-v3.1.0";

        reg       = <0x07630000 0x10000>,
                    <0x06a80000 0x10000>;
        reg-names = "primary", "secondary";

        interrupts      = <GIC_SPI 761 IRQ_TYPE_LEVEL_HIGH>,
                          <GIC_SPI 155 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "primary", "secondary";

        clocks      = <&lpass_txmacro>, <&lpass_rxmacro>;
        clock-names = "primary", "secondary";

        qcom,lane-banks = /bits/ 8 <0 0 1 1>;

        qcom,ports-sinterval-low =
                /bits/ 8 <0x00 0x00 0x03 0x03 0x00 0x03 0x1f 0x1f>;
        qcom,ports-offset1 =
                /bits/ 8 <0x00 0x01 0x02 0x00 0x00 0x00 0x00 0x0b>;
        qcom,ports-offset2 =
                /bits/ 8 <0x00 0xff 0x00 0x00 0xff 0x00 0x00 0x0b>;
        qcom,ports-lane-control =
                /bits/ 8 <0xff 0x01 0x00 0x01 0xff 0x03 0x02 0x02>;

        #sound-dai-cells = <1>;
        #address-cells   = <2>;
        #size-cells      = <0>;

        codec@3,0 {
            compatible = "sdw20217011000";
            reg = <0 3>;
            #sound-dai-cells = <1>;
            qcom,port-mapping = <2 2 3 4 5 6 7 8>;
        };
    };
