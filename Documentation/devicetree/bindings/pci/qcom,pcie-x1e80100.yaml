%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/qcom,pcie-x1e80100.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm X1E80100 PCI Express Root Complex

maintainers:
  - Bjorn Andersson <andersson@kernel.org>
  - Manivannan Sadhasivam <mani@kernel.org>

description:
  Qualcomm X1E80100 SoC (and compatible) PCIe root complex controller is based on
  the Synopsys DesignWare PCIe IP.

properties:
  compatible:
    oneOf:
      - const: qcom,pcie-x1e80100
      - items:
          - enum:
              - qcom,glymur-pcie
          - const: qcom,pcie-x1e80100

  reg:
    minItems: 6
    maxItems: 6

  reg-names:
    items:
      - const: parf # Qualcomm specific registers
      - const: dbi # DesignWare PCIe registers
      - const: elbi # External local bus interface registers
      - const: atu # ATU address space
      - const: config # PCIe configuration space
      - const: mhi # MHI registers

  clocks:
    minItems: 6
    maxItems: 7

  clock-names:
    minItems: 6
    items:
      - const: aux # Auxiliary clock
      - const: cfg # Configuration clock
      - const: bus_master # Master AXI clock
      - const: bus_slave # Slave AXI clock
      - const: slave_q2a # Slave Q2A clock
      - const: noc_aggr # Aggre NoC PCIe AXI clock
      - const: cnoc_sf_axi # Config NoC PCIe1 AXI clock

  interrupts:
    minItems: 8
    maxItems: 9

  interrupt-names:
    minItems: 8
    items:
      - const: msi0
      - const: msi1
      - const: msi2
      - const: msi3
      - const: msi4
      - const: msi5
      - const: msi6
      - const: msi7
      - const: global

  resets:
    minItems: 1
    maxItems: 2

  reset-names:
    minItems: 1
    items:
      - const: pci # PCIe core reset
      - const: link_down # PCIe link down reset

  qcom,pcie-recalibration-thermal-zones:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    minItems: 1
    maxItems: 16
    items:
      items:
        - description:
            Phandle to a thermal zone corresponding to the sensor used to
            monitor the PHY temperature drift.
        - description:
            Temperature drift this zone is allowed to accumulate before the
            PHY needs a fresh calibration, in millidegree Celsius.
          minimum: 1000
          maximum: 100000
    description:
      Thermal zones whose sensors track the PCIe PHY temperature, along with
      the temperature drift each zone is allowed to accumulate before the PHY
      needs a fresh calibration. Applies to SoCs that rely on periodic PCIe
      PHY recalibration to maintain stable link operation.

required:
  - power-domains
  - resets
  - reset-names

allOf:
  - $ref: qcom,pcie-common.yaml#
  - if:
      properties:
        compatible:
          contains:
            const: qcom,glymur-pcie
    then:
      properties:
        qcom,pcie-recalibration-thermal-zones: true
    else:
      properties:
        qcom,pcie-recalibration-thermal-zones: false

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,glymur-gcc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    thermal-zones {
        thermal_aoss_6: aoss-6-thermal {
            thermal-sensors = <&tsens6 0>;
        };
    };

    pcie@1b40000 {
        compatible = "qcom,glymur-pcie", "qcom,pcie-x1e80100";
        reg = <0x01b40000 0x3000>,
              <0x7a000000 0xf20>,
              <0x7a000f40 0xa8>,
              <0x7a001000 0x4000>,
              <0x7a100000 0x100000>,
              <0x01b43000 0x1000>;
        reg-names = "parf", "dbi", "elbi", "atu", "config", "mhi";
        ranges = <0x01000000 0x0 0x00000000 0x7a200000 0x0 0x100000>,
                 <0x02000000 0x0 0x7a300000 0x7a300000 0x0 0x3d00000>;

        bus-range = <0x00 0xff>;
        device_type = "pci";
        linux,pci-domain = <5>;
        num-lanes = <4>;

        #address-cells = <3>;
        #size-cells = <2>;

        clocks = <&gcc GCC_PCIE_5_AUX_CLK>,
                 <&gcc GCC_PCIE_5_CFG_AHB_CLK>,
                 <&gcc GCC_PCIE_5_MSTR_AXI_CLK>,
                 <&gcc GCC_PCIE_5_SLV_AXI_CLK>,
                 <&gcc GCC_PCIE_5_SLV_Q2A_AXI_CLK>,
                 <&gcc GCC_AGGRE_NOC_PCIE_5_EAST_SF_AXI_CLK>;
        clock-names = "aux",
                      "cfg",
                      "bus_master",
                      "bus_slave",
                      "slave_q2a",
                      "noc_aggr";

        dma-coherent;

        interrupts = <GIC_SPI 518 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 519 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 520 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 521 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 522 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 523 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 524 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 525 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 945 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "msi0", "msi1", "msi2", "msi3",
                          "msi4", "msi5", "msi6", "msi7", "global";
        #interrupt-cells = <1>;
        interrupt-map-mask = <0 0 0 0x7>;
        interrupt-map = <0 0 0 1 &intc 0 0 GIC_SPI 526 IRQ_TYPE_LEVEL_HIGH>,
                        <0 0 0 2 &intc 0 0 GIC_SPI 428 IRQ_TYPE_LEVEL_HIGH>,
                        <0 0 0 3 &intc 0 0 GIC_SPI 429 IRQ_TYPE_LEVEL_HIGH>,
                        <0 0 0 4 &intc 0 0 GIC_SPI 435 IRQ_TYPE_LEVEL_HIGH>;

        iommu-map = <0x0 &pcie_smmu 0x50000 0x10000>;

        power-domains = <&gcc GCC_PCIE_5_GDSC>;

        resets = <&gcc GCC_PCIE_5_BCR>,
                 <&gcc GCC_PCIE_5_LINK_DOWN_BCR>;
        reset-names = "pci", "link_down";

        qcom,pcie-recalibration-thermal-zones = <&thermal_aoss_6 25000>;
    };
